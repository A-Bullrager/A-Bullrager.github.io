<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — A-Bullrager</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1f'/%3E%3Ctext x='16' y='22' font-family='-apple-system,Helvetica,sans-serif' font-size='15' font-weight='600' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --bg:#ffffff;
  --text:#1d1d1f;
  --muted:#6e6e73;
  --muted-2:#86868b;
  --line:rgba(0,0,0,.08);
  --accent:#0071e3;
  --grad:linear-gradient(94deg,#0071e3 0%,#3ea6ff 100%);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#000000;
    --text:#f5f5f7;
    --muted:#a1a1a6;
    --muted-2:#86868b;
    --line:rgba(255,255,255,.12);
    --accent:#2997ff;
    --grad:linear-gradient(94deg,#2997ff 0%,#6ee7ff 100%);
  }
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:17px;line-height:1.5;letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none}
.nav{border-bottom:1px solid var(--line)}
.nav-inner{
  max-width:980px;margin:0 auto;padding:0 24px;height:50px;
  display:flex;align-items:center;
}
.logo{font-size:14px;font-weight:600}
main{
  flex:1;display:grid;place-items:center;text-align:center;
  padding:96px 24px;
}
.code{
  margin:0 0 20px;
  font-size:clamp(84px,16vw,150px);line-height:1;font-weight:600;letter-spacing:-.05em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
h1{margin:0 0 14px;font-size:clamp(24px,3.2vw,32px);font-weight:600;letter-spacing:-.02em}
p{margin:0 0 34px;color:var(--muted);font-size:16px}
.btn{
  display:inline-flex;align-items:center;
  padding:12px 26px;border-radius:980px;
  background:var(--accent);color:#fff;
  font-size:15px;font-weight:500;
  transition:opacity .2s ease,transform .2s ease;
}
.btn:hover{opacity:.88;transform:translateY(-1px)}
footer{padding:32px 0 40px;border-top:1px solid var(--line)}
.foot{
  max-width:980px;margin:0 auto;padding:0 24px;
  font-size:12px;color:var(--muted-2);
}
</style>
</head>
<body>

<div class="nav"><div class="nav-inner"><a class="logo" href="/">A-Bullrager</a></div></div>

<main>
  <div>
    <p class="code">404</p>
    <h1>这一章不存在。</h1>
    <p>页面可能被移动或删除了。</p>
    <a class="btn" href="/">回到首页</a>
  </div>
</main>

<footer><div class="foot">© 2026 A-Bullrager</div></footer>

</body>
</html>
