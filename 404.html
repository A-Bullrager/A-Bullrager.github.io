<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — A-Bullrager</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1d1f'/%3E%3Ctext x='16' y='22' font-family='-apple-system,Helvetica,sans-serif' font-size='15' font-weight='600' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<script>
(function(){
  var t = null;
  try { t = localStorage.getItem('theme'); } catch(e){}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="/assets/base.css">
<style>
body{ min-height: 100vh; display: flex; flex-direction: column; }
.e404{
  flex: 1;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 96px 22px;
}
.e404 .code{
  margin: 0 0 18px;
  font-size: clamp(84px, 15vw, 150px);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.05em;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.e404 h1{ font-size: clamp(24px, 3.4vw, 34px); margin: 0 0 12px; }
.e404 p{ margin: 0 0 32px; font-size: 16px; color: var(--text-2); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="/">A-Bullrager</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle light and dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.3 4.3l1.4 1.4M18.3 18.3l1.4 1.4M2.5 12h2M19.5 12h2M4.3 19.7l1.4-1.4M18.3 5.7l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="e404">
  <div>
    <p class="code">404</p>
    <h1>This chapter doesn’t exist.</h1>
    <p>The page may have been moved or deleted.</p>
    <a class="btn btn-primary" href="/">Back home</a>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span>© 2026 A-Bullrager</span>
    <span>Static site · GitHub Pages</span>
  </div>
</footer>

<script>
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e){}
});
</script>

</body>
</html>
