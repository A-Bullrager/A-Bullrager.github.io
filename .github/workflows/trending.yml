name: Update GitHub Trending

on:
  schedule:
    # 每周一 01:00 UTC（北京时间 09:00）抓一次官方周榜
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch weekly snapshot
        run: python scripts/fetch_trending.py

      - name: Rebuild monthly / yearly rankings
        run: python scripts/build_rankings.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: trending snapshot $(date -u +%F)"
          git push
