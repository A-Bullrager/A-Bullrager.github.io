name: Update GitHub Trending

on:
  schedule:
    # 周榜：每周日 14:00 UTC = 北京时间周日 22:00
    # GitHub 的 since=weekly 是「抓取时刻往前 7 天」的滚动窗口，
    # 放在周日晚上抓，覆盖的正好是上周一 → 本周日。
    - cron: "0 14 * * 0"
    # 月榜：每月 1 日 00:00 UTC = 北京时间 1 日 08:00
    # since=monthly 是「往前 30 天」的滚动窗口，1 号早上抓近似上月整月。
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch weekly trending
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14 * * 0'
        run: python scripts/fetch_trending.py --since weekly

      - name: Fetch monthly trending
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 1 * *'
        run: python scripts/fetch_trending.py --since monthly

      - name: Rebuild yearly rankings and index
        run: python scripts/build_rankings.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: trending snapshot $(date -u +%F)"
          git push
